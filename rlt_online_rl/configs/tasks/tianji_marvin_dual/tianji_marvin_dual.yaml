experiment:
  rl:
    action_dim: 16
    chunk_len: 10
    z_dim: 2048
    proprio_dim: 16
    action_representation: delta_chunk
    action_norm_stats_path: null

    gamma: 0.99
    fixed_std: 0.002
    reference_dropout_prob: 0.5
    delta_weight: 10.0
    warmup_bc_weight: 10.0
    warmup_q_weight: 0.1
    online_bc_weight: 5.0
    online_q_weight: 0.1

    actor_hidden_dim: 256
    actor_num_layers: 2
    critic_hidden_dim: 256
    critic_num_layers: 2

    actor_lr: 1e-4
    critic_lr: 1e-4
    target_tau: 0.005
    actor_update_period: 2

    warmup_min_size: 6000
    warmup_post_collect_updates: 20000
    freeze_after_warmup: false
    grad_updates_per_cycle: 5

runtime:
  role: all
  local_debug_mode: false

  monitoring:
    enable_wandb: true
    wandb_project: rlt-online-rl
    wandb_entity: null
    wandb_mode: offline
    wandb_run_name: tianji_marvin_dual
    wandb_dir: ./wandb

  actor_service:
    pull_params_interval_sec: 0.25
    rpc_timeout_sec: 0.2
    bind_host: 127.0.0.1
    port: 9101
    snapshot_path: ./runs/tianji_marvin_dual/actor_snapshot/actor_snapshot.pkl
    xla_mem_fraction: 0.10
    xla_preallocate: false

  learner_service:
    push_actor_interval_steps: 500
    checkpoint_interval_steps: 1000
    sample_batch_size: 128
    checkpoint_dir: ./runs/tianji_marvin_dual/checkpoints
    actor_snapshot_path: ./runs/tianji_marvin_dual/actor_snapshot/actor_snapshot.pkl
    replay_url: http://127.0.0.1:9102
    poll_interval_sec: 0.01
    xla_mem_fraction: 0.75
    xla_preallocate: false

  replay:
    capacity: 200000
    journal_path: ./runs/tianji_marvin_dual/replay/replay_journal.pkl
    bind_host: 127.0.0.1
    port: 9102
    seed: 0

  env_driver:
    machine_a_ws_url: ws://192.168.3.5:8099
    actor_service_url: http://127.0.0.1:9101
    replay_service_url: http://127.0.0.1:9102
    task_mode: critical_phase
    episode_start_control_mode: policy
    full_task_reset_action: null
    critical_phase_reset_action: null
    actor_deterministic: false
    chunk_exec_horizon: 10
    control_frequency_hz: 30.0
    step_trace_stride: 0
    replay_feature_batch_size: 16
    auto_critical_phase_enabled: false
    auto_critical_phase_control_enabled: false
    auto_critical_phase_checkpoint_path: ./runs/tianji_marvin_dual/critical_phase_gate/critical_phase_gate.pt
    auto_critical_phase_image_key: cam_left_wrist
    auto_critical_phase_image_size: 96
    auto_critical_phase_sample_frames: [first, middle]
    auto_critical_phase_min_samples: 200
    auto_critical_phase_train_every_steps: 20
    auto_critical_phase_batch_size: 32
    auto_critical_phase_lr: 3e-4
    auto_critical_phase_enter_threshold: 0.75
    auto_critical_phase_exit_threshold: 0.25
    enable_human_override: false
    safe_fallback_to_ref: true
    machine_a_connect_timeout_sec: 5.0
    machine_a_recv_timeout_sec: 5.0
    machine_a_retry_interval_sec: 0.5
    actor_request_timeout_sec: 2.0
    replay_request_timeout_sec: 30.0
