experiment:
  rl:
    # 16D policy/RLT units: left_j1..left_j7 deg, left_gripper_raw/100,
    # right_j1..right_j7 deg, right_gripper_raw/100.
    action_dim: 16
    chunk_len: 50
    z_dim: 2048
    proprio_dim: 16
    action_representation: delta_chunk
    # No dual-arm replay stats are committed yet. Keep null until stats are computed.
    action_norm_stats_path: null

    gamma: 0.99
    fixed_std: 0.002
    reference_dropout_prob: 0.5
    delta_weight: 10.0
    warmup_bc_weight: 10.0
    warmup_q_weight: 0.01
    online_bc_weight: 5.0
    online_q_weight: 0.1

    actor_hidden_dim: 256
    actor_num_layers: 2
    critic_hidden_dim: 256
    critic_num_layers: 2

    actor_lr: 1e-4
    critic_lr: 1e-4
    target_tau: 0.005
    actor_update_period: 2

    warmup_min_size: 10000
    warmup_post_collect_updates: 10000
    freeze_after_warmup: false
    grad_updates_per_cycle: 5

runtime:
  role: all
  local_debug_mode: false

  monitoring:
    enable_wandb: true
    wandb_project: rlt-online-rl
    wandb_entity: null
    wandb_mode: offline
    wandb_run_name: rokae_zhixing_dual
    wandb_dir: ./wandb

  actor_service:
    pull_params_interval_sec: 0.25
    rpc_timeout_sec: 0.2
    bind_host: 127.0.0.1
    port: 9101
    snapshot_path: ./runs/rokae_zhixing_dual/actor_snapshot/actor_snapshot.pkl
    xla_mem_fraction: 0.10
    xla_preallocate: false

  learner_service:
    push_actor_interval_steps: 100
    checkpoint_interval_steps: 1000
    sample_batch_size: 64
    checkpoint_dir: ./runs/rokae_zhixing_dual/checkpoints
    actor_snapshot_path: ./runs/rokae_zhixing_dual/actor_snapshot/actor_snapshot.pkl
    replay_url: http://127.0.0.1:9102
    poll_interval_sec: 0.01
    xla_mem_fraction: 0.75
    xla_preallocate: false

  replay:
    capacity: 200000
    journal_path: ./runs/rokae_zhixing_dual/replay/replay_journal.pkl
    bind_host: 127.0.0.1
    port: 9102
    seed: 0
    sample_strategy: uniform
    recent_episode_window: 20
    recent_online_ratio: 0.3
    warmup_demo_ratio: 0.3
    human_intervention_ratio: 0.3

  env_driver:
    machine_a_ws_url: ws://192.168.3.68:8099
    actor_service_url: http://127.0.0.1:9101
    replay_service_url: http://127.0.0.1:9102

    # UMI/manual override is handled by rokae_zhixing_dual_ros.py via JointState topics.
    task_mode: critical_phase
    episode_start_control_mode: policy

    # 16D reset action in dataset/RLT units:
    # [left joints deg, left gripper_raw/100, right joints deg, right gripper_raw/100].
    # Gripper values follow dataset conversion: SDK raw position divided by 100.
    # If left null, rokae_zhixing_dual_ros.py uses
    # examples/rokae_zhixing_dual/constants.py LEFT/RIGHT_RESET_END_POSE and IK.
    # Match the converted training-set initial gripper state instead of raw 0,
    # which is out of distribution and makes VLA immediately pull the grippers closed.
    full_task_reset_action: [-86.965, -30.498, 106.409, 99.709, 44.431, 30.097, -12.905, 26.06, 82.634, -33.864, -107.351, 99.859, -47.919, 26.951, 4.574, 20.58]
    critical_phase_reset_action: [-86.965, -30.498, 106.409, 99.709, 44.431, 30.097, -12.905, 26.06, 82.634, -33.864, -107.351, 99.859, -47.919, 26.951, 4.574, 20.58]

    actor_deterministic: false
    # Execute only the high-confidence prefix of the VLA 50-step chunk, then
    # re-observe and replan. The tail of the predicted horizon tends to flatten,
    # which makes full 50-step open-loop execution look fast-then-slow.
    chunk_exec_horizon: 30
    # Wait briefly before the next Machine A/VLA request so non-blocking servo
    # feedback has time to catch up to the last command of the previous chunk.
    chunk_boundary_observation_delay_sec: 0.10
    chunk_boundary_settle_tolerance: 0.50
    chunk_boundary_settle_timeout_sec: 1.20
    chunk_boundary_settle_poll_sec: 0.03
    chunk_start_reanchor_steps: 5
    control_frequency_hz: 30.0

    # Smooth Machine A / VLA ref_chunk before direct execution and before the
    # local RLT actor consumes it. Only arm joints are smoothed; grippers stay raw.
    ref_chunk_smoothing_alpha: 1.0
    ref_chunk_smoothing_passes: 1
    ref_chunk_smoothing_indices: [0, 1, 2, 3, 4, 5, 6, 8, 9, 10, 11, 12, 13, 14]
    observation_capture_interval: 10

    step_trace_stride: 0
    replay_feature_batch_size: 16

    auto_critical_phase_enabled: false
    auto_critical_phase_control_enabled: false
    auto_critical_phase_checkpoint_path: ./runs/rokae_zhixing_dual/critical_phase_gate/critical_phase_gate.pt
    auto_critical_phase_image_key: cam_left_wrist
    auto_critical_phase_image_size: 96
    auto_critical_phase_sample_frames: [first, middle]
    auto_critical_phase_min_samples: 200
    auto_critical_phase_train_every_steps: 20
    auto_critical_phase_batch_size: 32
    auto_critical_phase_lr: 3e-4
    auto_critical_phase_enter_threshold: 0.75
    auto_critical_phase_exit_threshold: 0.25

    # UMI 人为介入使能。rokae_zhixing_dual_ros.py 默认提供
    # /umi/teleop_trigger 和 /teleop_status，键盘脚本与 dobot_umi 保持一致。
    enable_human_override: true
    safe_fallback_to_ref: true

    machine_a_connect_timeout_sec: 5.0
    machine_a_recv_timeout_sec: 5.0
    machine_a_retry_interval_sec: 0.5
    actor_request_timeout_sec: 2.0
    replay_request_timeout_sec: 30.0
