experiment:
  rl:
    # ── 动作空间 ─────────────────────────────────────────────────────────────
    # 7D：6 个关节角（弧度）+ 1 个夹爪距离（米）
    action_dim: 7
    chunk_len: 50
    z_dim: 2048
    # 本体感知维度（与 action_dim 相同：[joint1..6, gripper_m]）
    proprio_dim: 7
    action_representation: delta_chunk
    # 归一化统计量，由 compute_norm_stats.py 生成
    action_norm_stats_path: stats/norm_stats_delta.json

    # ── 算法超参数 ───────────────────────────────────────────────────────────
    gamma: 0.99
    fixed_std: 0.002
    reference_dropout_prob: 0.2  # 训练时以一定概率丢弃参考动作输入，提升鲁棒性
    delta_weight: 10.0
    warmup_bc_weight: 10.0
    warmup_q_weight: 0.1
    online_bc_weight: 5.0
    online_q_weight: 0.1

    actor_hidden_dim: 256
    actor_num_layers: 2
    critic_hidden_dim: 256
    critic_num_layers: 2

    actor_lr: 1e-4
    critic_lr: 1e-4
    target_tau: 0.005
    actor_update_period: 2

    # warmup_min_size：收集到 600 条 transition 后进入在线 RL 阶段
    warmup_min_size: 600
    warmup_post_collect_updates: 5000
    freeze_after_warmup: false
    grad_updates_per_cycle: 5

runtime:
  role: all
  local_debug_mode: false

  monitoring:
    enable_wandb: true
    wandb_project: rlt-online-rl
    wandb_entity: null
    wandb_mode: offline
    wandb_run_name: dobot_umi
    wandb_dir: ./wandb

  actor_service:
    pull_params_interval_sec: 0.25
    rpc_timeout_sec: 0.2
    bind_host: 127.0.0.1
    port: 9101
    snapshot_path: ./runs/dobot_umi/actor_snapshot/actor_snapshot.pkl
    xla_mem_fraction: 0.10
    xla_preallocate: false

  learner_service:
    push_actor_interval_steps: 100
    checkpoint_interval_steps: 1000
    sample_batch_size: 128
    checkpoint_dir: ./runs/dobot_umi/checkpoints
    actor_snapshot_path: ./runs/dobot_umi/actor_snapshot/actor_snapshot.pkl
    replay_url: http://127.0.0.1:9102
    poll_interval_sec: 0.01
    xla_mem_fraction: 0.75
    xla_preallocate: false

  replay:
    capacity: 200000
    journal_path: ./runs/dobot_umi/replay/replay_journal.pkl
    bind_host: 127.0.0.1
    port: 9102
    seed: 0
    sample_strategy: uniform  # uniform / stratified
    recent_episode_window: 20
    recent_online_ratio: 0.3
    warmup_demo_ratio: 0.3
    # human_intervention_ratio：UMI 人为介入数据在采样中的占比
    human_intervention_ratio: 0.2

  env_driver:
    # ── Machine A（Pi0 策略服务器）WebSocket 地址 ────────────────────────────
    # 修改为实际策略服务器 IP
    # machine_a_ws_url: ws://218.4.163.187:8099
    machine_a_ws_url: ws://192.168.3.5:8099
    actor_service_url: http://127.0.0.1:9101
    replay_service_url: http://127.0.0.1:9102

    task_mode: critical_phase
    episode_start_control_mode: policy

    # reset target pose: [x_m, y_m, z_m, rx_rad, ry_rad, rz_rad, gripper_m]
    # Cartesian pose in base frame (position in meters, orientation in rad XYZ Euler)
    full_task_reset_action:      [0.5793687, -0.1360939, 0.2334053, 3.14, 0.0, -1.57, 0.08]
    critical_phase_reset_action: [0.5793687, -0.1360939, 0.2334053, 3.14, 0.0, -1.57, 0.08]

    actor_deterministic: true # 评估时使用确定性动作 true（均值），训练时使用随机动作 false （均值+固定方差噪声）
    chunk_exec_horizon: 30

    # 越疆 Dobot 推荐控制频率：20 Hz
    control_frequency_hz: 30.0

    step_trace_stride: 0
    replay_feature_batch_size: 16

    # UMI 人为介入使能
    enable_human_override: true
    safe_fallback_to_ref: true

    # ── UMI 坐标系对齐矩阵 R_align ──────────────────────────────────────────
    # 将 UMI 手柄体坐标系的增量旋转到机械臂末端体坐标系。
    # 行优先展开的 3×3 旋转矩阵（共 9 个数字）。
    # 不配置（注释掉）= 单位矩阵（不做对齐）。
    #
    # 标定方法：切换到 teleop，沿 UMI 各轴单独移动，观察机械臂末端响应方向：
    #   - 若 UMI 向前（+Z）→ 机械臂 +Z：Z 轴正确
    #   - 若 UMI 向右（+X）→ 机械臂 +Y：UMI X = robot Y，说明需要 R_align
    #
    # 常用候选（绕 Z 轴旋转 90°）：
    #   +90° CCW:  [ 0, -1, 0,  1, 0, 0,  0, 0, 1 ]  → UMI X→robotY, UMI Y→robot-X
    #   -90° CW:   [ 0,  1, 0, -1, 0, 0,  0, 0, 1 ]  → UMI X→robot-Y, UMI Y→robotX
    #   X/Y swap+negX: [-1, 0, 0,  0, -1, 0,  0, 0, 1 ] → X/Y 互换且双负
    #
    # 目前先以 +90° CCW 为初始猜测尝试（Z 轴正确，X/Y 疑似互换）：
    # umi_to_ee_R_align: [0, -1, 0,  1, 0, 0,  0, 0, 1]
    # X/Y 轴方向正确但符号相反 → 绕 Z 旋转 180°（X/Y 同时取负，Z 不变）：
    umi_to_ee_R_align: [-1, 0, 0,  0, -1, 0,  0, 0, 1]
    # ── 旋转增量单独对齐矩阵 ────────────────────────────────────────────────
    # 实测（平移正确，旋转错误）：
    #   UMI Rx+ → robot -Ry, UMI Ry+ → robot -Rx, UMI Rz+ → robot -Rz
    # 有效旋转映射 M_current = [[0,-1,0],[-1,0,0],[0,0,-1]]
    # VIO 旋转帧到物理 UMI 帧的固定变换 V = R_align.T @ M_current = [[0,1,0],[1,0,0],[0,0,-1]]
    # 期望恒等映射: R_align_rot_new = V^{-1} = V^T = [[0,1,0],[1,0,0],[0,0,-1]]
    # 即: UMI Rx→robot Rx, UMI Ry→robot Ry, UMI Rz→robot Rz
    umi_to_ee_R_align_rot: [0, 1, 0,  1, 0, 0,  0, 0, -1]

    # ── UMI 动作平滑与缩放 ────────────────────────────────────────────────────
    # motion_scale: 机械臂末端增量 = a × UMI 手柄增量（平移 m 和旋转 rad 同时缩放）
    #   建议范围 0.3 ~ 0.8，越小响应越柔和
    umi_motion_scale: 0.8
    # smooth_alpha: EMA 系数（0 < α ≤ 1）。α=1 不平滑，越小越平滑但延迟越大
    #   建议范围 0.2 ~ 0.6；以 20 Hz 控制频率为例，α=0.4 时时间常数约 75 ms
    umi_smooth_alpha: 0.4

    machine_a_connect_timeout_sec: 5.0
    machine_a_recv_timeout_sec: 5.0
    machine_a_retry_interval_sec: 0.5
    actor_request_timeout_sec: 2.0
    replay_request_timeout_sec: 30.0
